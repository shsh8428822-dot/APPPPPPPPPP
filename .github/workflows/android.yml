name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download pinned open-source game collections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zeli-web-games /tmp/mini-browser-games
          curl -fsSL "https://codeload.github.com/hajunho/zeli-web-games/tar.gz/ba9938eb222cb588ae7b0a6056ba6bdda89dcd9c" | tar -xz --strip-components=1 -C /tmp/zeli-web-games
          curl -fsSL "https://codeload.github.com/wangzifan396-wzf/mini-browser-games/tar.gz/e459369b31c35658855e7ef50b46fa9f994750d6" | tar -xz --strip-components=1 -C /tmp/mini-browser-games

      - name: Build and bundle 150 Apache-2.0 mini-games
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zeli-web-games
          npm ci
          npm run build -- --base=./
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets/opensource/zeli
          cp -R /tmp/zeli-web-games/dist/. app/src/main/assets/opensource/zeli/

      - name: Bundle 115 MIT single-file games and attribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/opensource/standalone
          mkdir -p app/src/main/assets/opensource/licenses
          cp /tmp/zeli-web-games/LICENSE app/src/main/assets/opensource/licenses/Zeli-Apache-2.0-LICENSE.txt
          cp /tmp/mini-browser-games/LICENSE app/src/main/assets/opensource/licenses/Mini-Browser-Games-MIT-LICENSE.txt
          python3 - <<'PY'
          import html
          import json
          import shutil
          from pathlib import Path

          source = Path("/tmp/mini-browser-games")
          output = Path("app/src/main/assets/opensource")
          standalone = output / "standalone"
          tiers = json.loads((source / "GAME_TIERS.json").read_text(encoding="utf-8"))["tiers"]
          active = []
          for tier in ("SSS", "SS", "S", "A"):
              active.extend(tiers.get(tier, []))
          if len(active) != 115 or len(set(active)) != 115:
              raise SystemExit(f"Expected 115 unique active MIT games, got {len(active)}")
          games = []
          for filename in active:
              src = source / filename
              if not src.is_file():
                  raise SystemExit(f"Missing licensed game file: {filename}")
              shutil.copy2(src, standalone / filename)
              label = src.stem.replace("-", " ").title()
              games.append({"file": filename, "name": label})

          (output / "standalone-games.json").write_text(
              json.dumps(games, ensure_ascii=False), encoding="utf-8"
          )

          game_json = json.dumps(games, ensure_ascii=False).replace("</", "<\\/")
          launcher = r'''<!doctype html>
          <html lang="he" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
          <meta name="theme-color" content="#080d0b">
          <title>PHONE SURVIVAL — ספריית משחקים</title>
          <style>
          :root{color-scheme:dark;--bg:#080d0b;--panel:#121a16;--accent:#39e58c;--muted:#a9bbb1}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f5f2;font-family:system-ui,-apple-system,sans-serif}
          header{position:sticky;top:0;z-index:5;padding:15px 14px;background:#0b120edc;backdrop-filter:blur(12px);border-bottom:1px solid #294235}
          h1{font-size:20px;margin:0 0 5px}p{color:var(--muted);font-size:12px;margin:0 0 12px;line-height:1.5}
          .tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.back{border:1px solid #315744;background:#15221a;color:#dfeee5;border-radius:12px;padding:10px 12px;font-weight:700}
          .tab.active,.primary{background:var(--accent);color:#061009;border-color:var(--accent)}
          main{padding:12px;max-width:1000px;margin:auto}.search{width:100%;padding:12px;border:1px solid #315744;border-radius:12px;background:#101a14;color:white;font-size:15px;margin:0 0 12px}
          .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.game{border:1px solid #233a2b;background:var(--panel);border-radius:14px;padding:12px;text-align:right;color:#f1f5f2;min-height:76px}
          .game strong{display:block;font-size:13px;overflow-wrap:anywhere}.game small{display:block;margin-top:5px;color:var(--muted)}
          #player{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column}
          #playerbar{display:flex;gap:8px;align-items:center;padding:9px 10px;background:#101a14;border-bottom:1px solid #294235}
          #gametitle{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          iframe{border:0;width:100%;height:100%;flex:1;background:white}
          #zeli{display:none;position:fixed;inset:0;z-index:8;background:var(--bg);flex-direction:column}
          #zeli iframe{min-height:0}
          .empty{text-align:center;color:var(--muted);padding:35px 12px}
          footer{padding:18px 4px 30px;text-align:center;color:#82948a;font-size:11px;line-height:1.7}
          a{color:var(--accent)}
          @media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.game strong{font-size:14px}}
          </style>
          </head><body>
          <header>
            <h1>🎮 PHONE SURVIVAL — משחקים לא מקוונים</h1>
            <p>265 משחקי קוד פתוח נוספים: 150 משחקוני מיני ו־115 משחקי HTML5. אחרי התקנת האפליקציה הם ארוזים במכשיר ואינם דורשים אינטרנט כדי להיטען.</p>
            <div class="tabs">
              <button class="tab active" id="htmltab" onclick="showHtml()">115 משחקי HTML5</button>
              <button class="tab" id="zelitab" onclick="showZeli()">150 משחקוני מיני</button>
            </div>
          </header>
          <main id="htmlpage">
            <input class="search" id="search" placeholder="חיפוש משחק…" autocomplete="off">
            <div class="grid" id="grid"></div>
            <div class="empty" id="empty" hidden>לא נמצאו משחקים מתאימים.</div>
            <footer>
              חלק מהמשחקים שומרים על שפת המקור שלהם (בעיקר אנגלית/סינית).<br>
              <a href="licenses/Zeli-Apache-2.0-LICENSE.txt">רישיון Apache-2.0</a> ·
              <a href="licenses/Mini-Browser-Games-MIT-LICENSE.txt">רישיון MIT</a>
            </footer>
          </main>
          <section id="player">
            <div id="playerbar"><button class="back primary" onclick="closeGame()">חזרה לרשימה</button><div id="gametitle"></div></div>
            <iframe id="gameframe" title="משחק מקומי" allow="fullscreen; autoplay"></iframe>
          </section>
          <section id="zeli">
            <div id="playerbar"><button class="back primary" onclick="showHtml()">חזרה לספרייה</button><div id="gametitle">150 משחקוני מיני</div></div>
            <iframe id="zeliframe" title="150 משחקוני מיני" src="zeli/index.html" allow="fullscreen; autoplay"></iframe>
          </section>
          <script>
          const games = __GAMES__;
          const grid=document.getElementById('grid'), search=document.getElementById('search');
          const htmlpage=document.getElementById('htmlpage'), player=document.getElementById('player'), zeli=document.getElementById('zeli');
          const gameframe=document.getElementById('gameframe');
          function render(){
            const q=search.value.trim().toLowerCase();
            const filtered=games.filter(g=>g.name.toLowerCase().includes(q)||g.file.toLowerCase().includes(q));
            grid.innerHTML='';
            filtered.forEach(g=>{
              const b=document.createElement('button');b.className='game';
              const strong=document.createElement('strong');strong.textContent=g.name;
              const small=document.createElement('small');small.textContent='משחק לא מקוון';
              b.append(strong,small);b.onclick=()=>openGame(g);grid.append(b);
            });
            document.getElementById('empty').hidden=filtered.length!==0;
          }
          function openGame(g){document.getElementById('gametitle').textContent=g.name;gameframe.src='standalone/'+g.file;player.style.display='flex';htmlpage.style.visibility='hidden';}
          function closeGame(){gameframe.src='about:blank';player.style.display='none';htmlpage.style.visibility='visible';}
          function showHtml(){zeli.style.display='none';htmlpage.style.display='block';document.getElementById('zelitab').classList.remove('active');document.getElementById('htmltab').classList.add('active');}
          function showZeli(){htmlpage.style.display='none';zeli.style.display='flex';document.getElementById('htmltab').classList.remove('active');document.getElementById('zelitab').classList.add('active');}
          search.addEventListener('input',render);render();
          </script>
          </body></html>'''.replace("__GAMES__", game_json)
          (output / "index.html").write_text(launcher, encoding="utf-8")
          print(f"Bundled {len(games)} offline MIT HTML5 games and generated the launcher.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-survival-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
